name: Boot Test with QEMU

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QEMU_TIMEOUT: 120  # Configurable timeout in seconds

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git diff in formatting step

    - name: Install Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y qemu-system-i386 astyle build-essential nasm

    - name: Fix C Code Formatting Only
      if: github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, 'Auto-format code with astyle')
      run: |
        echo "Fixing formatting for C files only..."
        # Only process .c and .h files, exclude assembly files
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec astyle --style=kr --indent=spaces=4 --lineend=linux -n {} \;
        
        if ! git diff --exit-code; then
          echo "Formatting changes detected. Committing and pushing..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-format code with astyle"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        else
          echo "✅ No formatting changes needed."
        fi

    - name: Build emergeos.img with Make
      run: |
        echo "Building emergeos.img with Makefile..."
        make emergeos.img || { echo "Error: Make failed"; exit 1; }
        ls -la emergeos.img

    - name: Run QEMU and Check Boot
      run: |
        echo "Starting QEMU with emergeos.img..."
        timeout ${{ env.QEMU_TIMEOUT }}s qemu-system-i386 \
          -drive format=raw,file=emergeos.img \
          -serial stdio \
          -display none \
          -machine pc \
          -m 64M > serial.log 2>&1 || true
        
        echo "--- Serial Output ---"
        cat serial.log
        echo "---------------------"
        
        if grep -q "Kernel" serial.log; then
          echo "✅ Boot successful!"
        else
          echo "❌ No kernel message found."
          exit 1
        fi

    - name: Upload Serial Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serial-output
        path: serial.log
