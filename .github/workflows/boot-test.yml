name: Boot Test with QEMU

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QEMU_TIMEOUT: 120  # Configurable timeout in seconds

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git diff in formatting step

    - name: Cache APT Dependencies
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile') }}-v3
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install Dependencies
      run: |
        echo "Checking cached dependencies..."
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
          echo "Cache miss. Updating package list and installing dependencies..."
          sudo apt-get update -y
          sudo apt-get install -y build-essential nasm qemu-system-i386 astyle gcc-multilib g++-multilib
        else
          echo "✅ APT dependencies found in cache."
        fi

    - name: Verify Tools Installation
      run: |
        echo "Verifying tool availability:"
        which gcc && gcc --version | head -1
        which ld && ld --version | head -1
        which objcopy && objcopy --version | head -1
        which nasm && nasm -v
        which astyle && astyle --version
        which qemu-system-i386 && qemu-system-i386 --version | head -1

    - name: Fix C Code Formatting Only
      if: github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, 'Auto-format code with astyle')
      run: |
        echo "Fixing formatting for C files only..."
        # Only process .c and .h files, exclude assembly files
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec astyle --style=kr --indent=spaces=4 --lineend=linux -n {} \;
        
        if ! git diff --exit-code; then
          echo "Formatting changes detected. Committing and pushing..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-format code with astyle"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        else
          echo "✅ No formatting changes needed."
        fi

    - name: Modify Makefile for Native Tools
      run: |
        echo "Updating Makefile to use native tools with -m32 flag..."
        # Create a modified Makefile for native compilation
        cat > Makefile.native << 'EOF'
# Tools - using native tools with -m32 flag
ASM = nasm
CC = gcc -m32
LD = ld -m elf_i386
OBJCOPY = objcopy
QEMU = qemu-system-i386

# Flags
ASMFLAGS = -f bin
ASMFLAGS_ELF = -f elf32
CFLAGS = -c -ffreestanding -fno-pie -nostdlib -nostdinc -O1 -Wall -Wextra
LDFLAGS = -T linker.ld -nostdlib

# Output files
BOOTLOADER = boot.bin
KERNEL_ELF = kernel.elf
KERNEL_BIN = kernel.bin
DISK_IMAGE = emergeos.img

# Source files
BOOT_SRC = boot.asm
KERNEL_ENTRY_SRC = kernel_entry.asm
KERNEL_SRC = holographic_kernel.c

# Object files
KERNEL_ENTRY_OBJ = kernel_entry.o
KERNEL_OBJ = holographic_kernel.o

# Default target
all: $(DISK_IMAGE)

# Rule to build bootloader
$(BOOTLOADER): $(BOOT_SRC)
	$(ASM) $(ASMFLAGS) $< -o $@

# Rule to build kernel entry object
$(KERNEL_ENTRY_OBJ): $(KERNEL_ENTRY_SRC)
	$(ASM) $(ASMFLAGS_ELF) $< -o $@

# Rule to build kernel object
$(KERNEL_OBJ): $(KERNEL_SRC)
	$(CC) $(CFLAGS) $< -o $@

# Rule to link kernel objects into ELF
$(KERNEL_ELF): $(KERNEL_ENTRY_OBJ) $(KERNEL_OBJ)
	$(LD) $(LDFLAGS) $^ -o $@

# Rule to convert ELF to binary
$(KERNEL_BIN): $(KERNEL_ELF)
	$(OBJCOPY) -O binary $< $@

# Rule to create disk image
$(DISK_IMAGE): $(BOOTLOADER) $(KERNEL_BIN)
	dd if=/dev/zero of=$@ bs=512 count=2880
	dd if=$(BOOTLOADER) of=$@ conv=notrunc
	dd if=$(KERNEL_BIN) of=$@ seek=1 conv=notrunc

# Run the OS in QEMU
run: $(DISK_IMAGE)
	$(QEMU) -fda $<

# Clean build artifacts
clean:
	rm -f *.bin *.o *.elf *.img

# Phony targets
.PHONY: all run clean
EOF

        # Use the native Makefile
        cp Makefile.native Makefile
        echo "✅ Makefile updated for native compilation"

    - name: Build emergeos.img
      run: |
        echo "Building emergeos.img with native tools..."
        echo "Using compiler: $(which gcc)"
        
        if [ ! -f Makefile ]; then
          echo "Error: Makefile not found."
          ls -la
          exit 1
        fi
        
        # Build the project
        make clean || true
        make emergeos.img || { echo "Error: Make failed"; exit 1; }
        
        if [ ! -f emergeos.img ]; then
          echo "Error: emergeos.img was not created."
          echo "Current directory contents:"
          ls -la
          echo "Build artifacts:"
          ls -la *.bin *.o *.elf *.img 2>/dev/null || echo "No build artifacts found"
          exit 1
        fi
        echo "✅ emergeos.img created successfully."
        ls -la emergeos.img

    - name: Run QEMU and Check Boot
      run: |
        if [ ! -f emergeos.img ]; then
          echo "Error: emergeos.img not found."
          exit 1
        fi
        echo "Starting QEMU with emergeos.img..."
        timeout ${{ env.QEMU_TIMEOUT }}s qemu-system-i386 \
          -fda emergeos.img \
          -serial stdio \
          -display none \
          -machine pc \
          -m 64M > serial.log 2>&1 || true
        
        echo "--- Serial Output ---"
        cat serial.log
        echo "---------------------"
        
        if grep -qi "kernel" serial.log; then
          echo "✅ Boot successful! Kernel message found."
        else
          echo "❌ No kernel message found in output."
          echo "Checking for any boot output..."
          if [ -s serial.log ]; then
            echo "Output contained: $(wc -l < serial.log) lines"
            head -20 serial.log
          else
            echo "Serial log is empty - QEMU may have failed to start"
          fi
          exit 1
        fi

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          emergeos.img
          serial.log
          *.bin
          *.elf
        if-no-files-found: warn

    - name: Upload Serial Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serial-output
        path: serial.log
        if-no-files-found: warn
