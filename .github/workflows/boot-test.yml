name: Boot Test with QEMU

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache APT and Dependencies
      id: apt-cache
      uses: actions/cache@v3
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('dependencies.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Cache Installed Tools
      id: tools-cache
      uses: actions/cache@v3
      with:
        path: |
          /usr/bin/astyle
          /usr/bin/make
        key: ${{ runner.os }}-tools-${{ hashFiles('dependencies.txt') }}
        restore-keys: |
          ${{ runner.os }}-tools-

    - name: Install All Dependencies
      run: |
        echo "Checking cached dependencies..."
        if [ "${{ steps.tools-cache.outputs.cache-hit }}" != "true" ] || [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
          echo "Cache miss or partial miss. Updating package list and installing dependencies..."
          sudo apt-get update -y
          
          echo "Installing core dependencies..."
          sudo apt-get install -y qemu-system-i386 astyle build-essential
          
          echo "Verifying Artistic Style installation..."
          if ! command -v astyle &> /dev/null; then
            echo "astyle not found. Installing..."
            sudo apt-get install -y astyle
          else
            echo "✅ astyle is already installed."
          fi
        else
          echo "✅ All dependencies found in cache. Skipping installation."
        fi

    - name: Fix Code Formatting Automatically
      run: |
        echo "Checking if workflow file was modified..."
        if git diff --name-only HEAD^ HEAD | grep -q "^\.github/workflows/.*\.yml"; then
          echo "Workflow file modified. Skipping formatting to avoid re-triggering."
        else
          echo "Automatically fixing code formatting for C and Assembly..."
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.s" -o -name "*.asm" \) -exec astyle --style=kr --indent=spaces=4 --lineend=linux -n {} \;
          
          if ! git diff --exit-code; then
            echo "Changes found. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config --global credential.helper "store"
            echo "https://github-actions[bot]:${{ secrets.PAT_TOKEN }}@github.com" > ~/.git-credentials
            git add .
            git commit -m "Auto-format code with astyle"
            git push
          else
            echo "No formatting changes needed."
          fi
        fi

    - name: Build emergeos.img with Makefile
      run: |
        echo "Building emergeos.img with Makefile..."
        if [ ! -f Makefile ]; then
          echo "Error: Makefile not found. Please ensure a Makefile exists in the repository root."
          exit 1
        fi
        make emergeos.img
        if [ ! -f emergeos.img ]; then
          echo "Error: emergeos.img was not created. Check your Makefile and build process."
          exit 1
        fi

    - name: Run QEMU and Check Boot Output
      id: run-qemu
      run: |
        set -e
        echo "Starting QEMU in a background process..."
        if [ ! -f emergeos.img ]; then
          echo "Error: emergeos.img not found. Please ensure it exists in the repository root."
          exit 1
        fi
        qemu-system-i386 \
          -fda emergeos.img \
          -serial file:serial.log \
          -display none \
          -monitor none \
          -machine pc \
          -d cpu_reset \
          -no-reboot \
          -no-shutdown \
          -boot a \
          -m 64M \
          -accel off \
          -nographic &
        
        QEMU_PID=$!
        echo "QEMU process started with PID: $QEMU_PID. Waiting for serial output..."

        TIMEOUT=120
        ELAPSED=0
        while [ ! -s serial.log ] || ! grep -q "Kernel" serial.log; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "Timeout waiting for serial output."
                kill -9 $QEMU_PID || true
                exit 1
            fi
            sleep 1
            ELAPSED=$((ELAPSED+1))
        done

        echo "✅ Successfully found 'Kernel' message in serial output."
        kill $QEMU_PID
        echo "Waiting for QEMU process to terminate..."
        wait $QEMU_PID || true
        echo "QEMU process terminated."

        echo "--- Serial Output ---"
        cat serial.log
        echo "---------------------"
        
        if grep -q "Kernel" serial.log; then
            echo "✅ Boot successful!"
        else
            echo "❌ No kernel message found. Boot failed."
            exit 1
        fi
    
    - name: Upload Serial Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serial-output
        path: serial.log
