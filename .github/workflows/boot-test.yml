name: Boot Test with Ninja and Multilib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache APT and Dependencies
      id: apt-cache
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('dependencies.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Cache clang-format Binary
      id: clang-format-cache
      uses: actions/cache@v3
      with:
        path: /usr/bin/clang-format
        key: ${{ runner.os }}-clang-format-binary
        restore-keys: |
          ${{ runner.os }}-clang-format-binary

    - name: Install All Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib ninja qemu-system-i386 clang-format

    - name: Fix Code Formatting Automatically
      run: |
        echo "Automatically fixing code formatting errors for C/C++ and Assembly..."
        # This command now includes .s and .asm files for formatting
        find . -name "*.c" -o -name "*.h" -o -name "*.s" -o -name "*.asm" | xargs clang-format -i
        
        if ! git diff --exit-code; then
          echo "Changes found. Committing and pushing..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-format code"
          git push
        else
          echo "No formatting changes needed."
        fi

    - name: Build Kernel and Disk Image with Ninja
      run: |
        echo "Building the project with Ninja..."
        ninja
        
    - name: Run QEMU and Check Boot Output
      id: run-qemu
      run: |
        set -e
        echo "Starting QEMU in a background process..."
        qemu-system-i386 \
          -fda emergeos.img \
          -serial file:serial.log \
          -display none \
          -monitor none \
          -machine pc \
          -d cpu_reset \
          -no-reboot \
          -no-shutdown \
          -boot a \
          -m 64M \
          -accel off \
          -nographic &
        
        QEMU_PID=$!
        echo "QEMU process started with PID: $QEMU_PID. Waiting for serial output..."

        TIMEOUT=120
        ELAPSED=0
        while [ ! -s serial.log ] || ! grep -q "Kernel" serial.log; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "Timeout waiting for serial output."
                kill -9 $QEMU_PID || true
                exit 1
            fi
            sleep 1
            ELAPSED=$((ELAPSED+1))
        done

        echo "✅ Successfully found 'Kernel' message in serial output."
        kill $QEMU_PID
        echo "Waiting for QEMU process to terminate..."
        wait $QEMU_PID || true
        echo "QEMU process terminated."

        echo "--- Serial Output ---"
        cat serial.log
        echo "---------------------"
        
        if grep -q "Kernel" serial.log; then
            echo "✅ Boot successful!"
        else
            echo "❌ No kernel message found. Boot failed."
            exit 1
        fi
    
    - name: Upload Serial Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serial-output
        path: serial.log
