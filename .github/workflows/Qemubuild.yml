name: Boot Test with QEMU and Bochs (Enhanced)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QEMU_TIMEOUT: 180
      BOCHS_TIMEOUT: 180
      IMAGE_NAME: emergeos.img
      QEMU_LOG: serial.log
      BOCHS_LOG: bochs.log
      BOCHS_CONSOLE_LOG: bochs_console.log

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v7
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            nasm \
            qemu-system-i386 \
            gcc-multilib \
            g++-multilib \
            bochs \
            bochs-x \
            libncurses5-dev \
            libgtk2.0-dev \
            libx11-dev

      - name: Verify Toolchain Versions
        run: |
          echo "=== TOOLCHAIN VERSIONS ==="
          
          # GCC
          echo "GCC:"
          gcc --version
          
          # LD
          echo "LD:"
          ld --version
          
          # NASM
          echo "NASM:"
          nasm -v
          
          # QEMU
          echo "QEMU:"
          qemu-system-i386 --version
          
          # Bochs - Use proper version checking method
          echo "Bochs:"
          bochs --help | grep -A 10 "Bochs x86 Emulator" || echo "Bochs version check failed"

      - name: Validate Source Structure
        run: |
          required_files=("Makefile" "boot.asm" "kernel_entry.asm" "holographic_kernel.c" "linker.ld")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ $file exists"
            fi
          done

      - name: Build Kernel Image
        run: |
          echo "Starting build process..."
          make clean || true
          
          # Check if Makefile exists
          if [ ! -f Makefile ]; then
            echo "❌ Makefile not found!"
            ls -la
            exit 1
          fi
          
          # Build the image
          echo "Building $IMAGE_NAME..."
          make $IMAGE_NAME 2>&1 | tee build_output.log
          
          # Verify build success
          if [ ! -f $IMAGE_NAME ]; then
            echo "❌ Build failed - $IMAGE_NAME not created"
            echo "Build output:"
            cat build_output.log
            exit 1
          fi
          
          echo "✅ Build successful! $IMAGE_NAME created ($(stat -c%s $IMAGE_NAME) bytes)"
          echo "Build artifacts:"
          ls -la *.bin *.o *.elf 2>/dev/null || echo "No additional artifacts found"

      - name: QEMU Boot Test
        continue-on-error: true
        run: |
          echo "Starting QEMU boot test..."
          sleep 2
          
          # Create log directory
          mkdir -p logs
          
          # Run QEMU with explicit raw format and better error handling
          timeout $QEMU_TIMEOUT qemu-system-i386 \
            -drive format=raw,file=$IMAGE_NAME,if=floppy \
            -serial file=$QEMU_LOG \
            -nographic \
            -machine pc \
            -cpu pentium \
            -m 128M \
            -no-reboot \
            -display none \
            -d int,cpu_reset \
            -monitor none \
            > logs/qemu_run.log 2>&1 || echo "QEMU exited (expected)"
          
          echo "--- QEMU Serial Output ---"
          if [ -f $QEMU_LOG ] && [ -s $QEMU_LOG ]; then
            cat $QEMU_LOG
          else
            echo "No serial output captured"
          fi
          
          echo "--- QEMU Run Log ---"
          if [ -f logs/qemu_run.log ]; then
            cat logs/qemu_run.log
          fi
          
          echo "-------------------------"

      - name: Analyze QEMU Results
        if: always()
        run: |
          if [ ! -f $QEMU_LOG ] || [ ! -s $QEMU_LOG ]; then
            echo "❌ No QEMU log detected"
            exit 1
          fi
          
          echo "Checking for success patterns..."
          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $QEMU_LOG; then
            echo "✅ QEMU SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting\|Holographic Kernel Starting" $QEMU_LOG; then
            echo "⚠️  QEMU PARTIAL: Kernel started but may not have completed initialization"
            tail -20 $QEMU_LOG
          elif grep -qi "Protected Mode Test: PASSED" $QEMU_LOG; then
            echo "⚠️  QEMU PARTIAL: Protected mode OK but kernel initialization incomplete"
            tail -20 $QEMU_LOG
          else
            echo "❌ QEMU FAILURE: No initialization detected"
            echo "Full output:"
            cat $QEMU_LOG
            exit 1
          fi

      - name: Generate Bochs Configuration
        run: |
          cat > bochsrc.txt <<EOF
          megs: 128
          romimage: file=/usr/share/bochs/BIOS-bochs-latest
          vgaromimage: file=/usr/share/bochs/VGABIOS-lgpl-latest
          floppya: 1_44=$IMAGE_NAME, status=inserted
          boot: a
          log: $BOCHS_LOG
          panic: action=ask
          error: action=report
          info: action=report
          debug: action=ignore
          clock: sync=realtime
          display_library: x
          EOF

      - name: Bochs Boot Test
        continue-on-error: true
        run: |
          echo "Starting Bochs boot test..."
          sleep 2
          
          # Run Bochs with proper configuration
          timeout $BOCHS_TIMEOUT bochs -q -f bochsrc.txt > $BOCHS_CONSOLE_LOG 2>&1 || echo "Bochs exited (expected)"
          
          echo "--- Bochs Log Output ---"
          if [ -f $BOCHS_LOG ]; then
            tail -20 $BOCHS_LOG
          fi
          
          echo "--- Bochs Console Output ---"
          if [ -f $BOCHS_CONSOLE_LOG ]; then
            tail -20 $BOCHS_CONSOLE_LOG
          fi
          
          echo "-------------------------"

      - name: Analyze Bochs Results
        if: always()
        run: |
          if [ ! -f $BOCHS_LOG ] || [ ! -s $BOCHS_LOG ]; then
            echo "❌ No Bochs log detected"
            exit 1
          fi
          
          echo "Checking for success patterns..."
          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $BOCHS_LOG; then
            echo "✅ Bochs SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting\|Holographic Kernel Starting" $BOCHS_LOG; then
            echo "⚠️  Bochs PARTIAL: Kernel started but may not have completed initialization"
            tail -20 $BOCHS_LOG
          elif grep -qi "Protected Mode Test: PASSED" $BOCHS_LOG; then
            echo "⚠️  Bochs PARTIAL: Protected mode OK but kernel initialization incomplete"
            tail -20 $BOCHS_LOG
          else
            echo "❌ Bochs FAILURE: No initialization detected"
            echo "Full output:"
            cat $BOCHS_LOG
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            $IMAGE_NAME
            $QEMU_LOG
            $BOCHS_LOG
            $BOCHS_CONSOLE_LOG
            bochsrc.txt
            Makefile
            boot.asm
            kernel_entry.asm
            holographic_kernel.c
            linker.ld
            *.o
            *.elf
            *.bin
            build_output.log
            logs/
          retention-days: 30

      - name: Post Cache Cleanup
        run: |
          sudo apt-get clean
          rm -rf /var/lib/apt/lists/*
