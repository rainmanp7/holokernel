name: Boot Test with QEMU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QEMU_TIMEOUT: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v7
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential nasm qemu-system-i386 gcc-multilib g++-multilib

      - name: Verify Tools Installation
        run: |
          which gcc && gcc --version
          which ld && ld --version
          which objcopy && objcopy --version
          which nasm && nasm -v
          which qemu-system-i386 && qemu-system-i386 --version

      - name: List Source Files
        run: |
          echo "Source files in repository:"
          ls -la
          echo "Checking for required files:"
          for file in Makefile boot.asm kernel_entry.asm holographic_kernel.c linker.ld; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
            fi
          done

      - name: Build emergeos.img
        run: |
          if [ ! -f Makefile ]; then
            echo "Error: Makefile not found." && ls -la && exit 1
          fi

          make clean 2>&1 || echo "Clean completed with warnings"
          echo "Building emergeos.img..."
          make emergeos.img

          if [ ! -f emergeos.img ]; then
            echo "Error: emergeos.img was not created."
            echo "Build artifacts:"
            ls -la *.bin *.o *.elf 2>/dev/null || echo "No build artifacts found"
            exit 1
          fi

          IMAGE_ACTUAL_PATH=$(realpath emergeos.img)
          echo "✅ Build successful! emergeos.img created at: $IMAGE_ACTUAL_PATH"
          echo "Image size: $(stat -c%s emergeos.img) bytes"

      - name: Check Floppy Image Size and Boot Signature
        run: |
          if [ "$(stat -c%s emergeos.img)" != "1474560" ]; then
            echo "❌ emergeos.img is not 1.44MB! Got $(stat -c%s emergeos.img) bytes."
            exit 1
          fi
          dd if=emergeos.img bs=1 skip=510 count=2 2>/dev/null | hexdump -C
          sig1=$(dd if=emergeos.img bs=1 skip=510 count=1 2>/dev/null | od -An -tx1 | tr -d ' ')
          sig2=$(dd if=emergeos.img bs=1 skip=511 count=1 2>/dev/null | od -An -tx1 | tr -d ' ')
          if [ "$sig1" != "55" ] || [ "$sig2" != "aa" ]; then
            echo "❌ Boot sector signature (0x55AA) missing!"
            exit 1
          fi
          echo "✅ Floppy image size and boot signature are correct."

      - name: Test Boot with QEMU
        run: |
          echo "Starting QEMU boot test..."
          sleep 2
          timeout "${QEMU_TIMEOUT}"s qemu-system-i386 \
            -fda emergeos.img \
            -serial stdio \
            -nographic \
            -machine pc \
            -cpu pentium \
            -m 64M \
            -no-reboot \
            -d int,guest_errors \
            -D qemu-debug.log \
            -display none > serial.log 2>&1
          echo "QEMU exit code: $?"
          echo "--- QEMU Serial Output ---"
          if [ -f serial.log ] && [ -s serial.log ]; then
            cat serial.log
          else
            echo "No serial output captured"
          fi
          echo "-------------------------"

      - name: Verify Boot Success
        run: |
          if [ ! -f serial.log ] || [ ! -s serial.log ]; then
            echo "❌ No serial output - QEMU may have failed to start"
            exit 1
          fi

          echo "Checking for success patterns..."
          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" serial.log; then
            echo "✅ SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting\|Holographic Kernel Starting" serial.log; then
            echo "⚠️  PARTIAL: Kernel started but may not have completed initialization"
            echo "Last few lines of output:"
            tail -10 serial.log
          elif grep -qi "Protected Mode Test: PASSED" serial.log; then
            echo "⚠️  PARTIAL: Protected mode OK but kernel initialization incomplete"
            echo "Output:"
            cat serial.log
          else
            echo "❌ FAILED: Kernel did not initialize properly"
            echo "Full output:"
            cat serial.log
            exit 1
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            emergeos.img
            serial.log
            boot.bin
            kernel.elf
            kernel.bin
            clean.log
          if-no-files-found: warn

      - name: Upload QEMU Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-debug
          path: qemu-debug.log
          if-no-files-found: warn

      - name: Upload Serial Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-output
          path: serial.log
          if-no-files-found: warn
