name: Boot Test with Bochs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: emergeos.img
      BOCHS_LOG: bochs.log
      BOCHS_CONSOLE_LOG: bochs_console.log
      BOCHS_TIMEOUT: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v7
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            g++-multilib \
            bochs \
            bochs-x \
            libncurses5-dev \
            libgtk2.0-dev \
            libx11-dev

      - name: Verify Toolchain Versions
        run: |
          echo "=== TOOLCHAIN VERSIONS ==="
          echo "GCC:"
          gcc --version
          echo "LD:"
          ld --version
          echo "NASM:"
          nasm -v
          echo "Bochs:"
          bochs --help | grep -A 10 "Bochs x86 Emulator" || echo "Bochs version check failed"

      - name: Validate Source Structure
        run: |
          required_files=("Makefile" "boot.asm" "kernel_entry.asm" "holographic_kernel.c" "linker.ld")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ $file exists"
            fi
          done

      - name: Build Kernel Image
        run: |
          echo "Starting build process..."
          make clean || true
          
          if [ ! -f Makefile ]; then
            echo "❌ Makefile not found!"
            ls -la
            exit 1
          fi
          
          echo "Building $IMAGE_NAME..."
          make $IMAGE_NAME 2>&1 | tee build_output.log
          
          if [ ! -f $IMAGE_NAME ]; then
            echo "❌ Build failed - $IMAGE_NAME not created"
            echo "Build output:"
            cat build_output.log
            exit 1
          fi
          
          echo "✅ Build successful! $IMAGE_NAME created ($(stat -c%s $IMAGE_NAME) bytes)"
          ls -la *.bin *.o *.elf 2>/dev/null || echo "No additional artifacts found"

      - name: Generate Bochs Configuration
        run: |
          cat > bochsrc.txt <<EOF
          megs: 128
          romimage: file=/usr/share/bochs/BIOS-bochs-latest
          vgaromimage: file=/usr/share/bochs/VGABIOS-lgpl-latest
          floppya: 1_44=$IMAGE_NAME, status=inserted
          boot: a
          log: $BOCHS_LOG
          panic: action=ask
          error: action=report
          info: action=report
          debug: action=ignore
          clock: sync=realtime
          display_library: none  # 👈 Fixed: Use 'none' for headless CI environments
          EOF

      - name: Run Bochs Boot Test
        continue-on-error: true
        run: |
          echo "Starting Bochs boot test..."
          sleep 2
          
          # Create logs directory
          mkdir -p logs
          
          # Run Bochs with full output capture
          timeout $BOCHS_TIMEOUT bochs -q -f bochsrc.txt > $BOCHS_CONSOLE_LOG 2>&1 || echo "Bochs exited (expected)"
          
          # Check if log was created
          if [ -f $BOCHS_LOG ]; then
            echo "✅ Bochs log created: $BOCHS_LOG"
            tail -20 $BOCHS_LOG
          else
            echo "❌ Bochs log NOT created!"
            echo "Check bochsrc.txt and ensure paths are correct."
          fi
          
          # Show console output
          if [ -f $BOCHS_CONSOLE_LOG ]; then
            echo "--- Bochs Console Output ---"
            tail -20 $BOCHS_CONSOLE_LOG
          else
            echo "--- No console output captured ---"
          fi

      - name: Analyze Bochs Results
        if: always()
        run: |
          if [ ! -f $BOCHS_LOG ] || [ ! -s $BOCHS_LOG ]; then
            echo "❌ No Bochs log detected"
            exit 1
          fi
          
          echo "Checking for success patterns..."
          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $BOCHS_LOG; then
            echo "✅ SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting\|Holographic Kernel Starting" $BOCHS_LOG; then
            echo "⚠️  PARTIAL: Kernel started but may not have completed initialization"
            tail -20 $BOCHS_LOG
          elif grep -qi "Protected Mode Test: PASSED" $BOCHS_LOG; then
            echo "⚠️  PARTIAL: Protected mode OK but kernel initialization incomplete"
            tail -20 $BOCHS_LOG
          else
            echo "❌ FAILURE: No initialization detected"
            echo "Full output:"
            cat $BOCHS_LOG
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            $IMAGE_NAME
            $BOCHS_LOG
            $BOCHS_CONSOLE_LOG
            bochsrc.txt
            Makefile
            boot.asm
            kernel_entry.asm
            holographic_kernel.c
            linker.ld
            *.o
            *.elf
            *.bin
            build_output.log
            logs/
          retention-days: 30

      - name: Post Cache Cleanup
        run: |
          sudo apt-get clean
          rm -rf /var/lib/apt/lists/*
