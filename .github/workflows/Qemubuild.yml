name: Boot Test with QEMU and Bochs (Enhanced)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QEMU_TIMEOUT: 180
      BOCHS_TIMEOUT: 180
      IMAGE_NAME: emergeos.img

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v7
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            nasm \
            qemu-system-i386 \
            gcc-multilib \
            g++-multilib \
            bochs \
            bochs-x \
            libncurses5-dev  # Required for Bochs TUI

      - name: Verify Toolchain Versions
        run: |
          echo "GCC:"
          gcc --version
          echo "LD:"
          ld --version
          echo "NASM:"
          nasm -v
          echo "QEMU:"
          qemu-system-i386 --version
          echo "Bochs:"
          bochs --version

      - name: Validate Source Structure
        run: |
          required_files=("Makefile" "boot.asm" "kernel_entry.asm" "holographic_kernel.c" "linker.ld")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ $file exists"
            fi
          done

      - name: Build Kernel Image
        run: |
          make clean || true
          make $IMAGE_NAME
          if [ ! -f $IMAGE_NAME ]; then
            echo "❌ Build failed - no image created"
            exit 1
          fi
          echo "✅ Built $IMAGE_NAME ($(stat -c%s $IMAGE_NAME) bytes)"
          ls -la *.bin *.o *.elf

      - name: QEMU Boot Test
        continue-on-error: true
        env:
          QEMU_LOG: qemu.log
        run: |
          echo "Starting QEMU with logging..."
          timeout $QEMU_TIMEOUT qemu-system-i386 \
            -drive format=raw,file=$IMAGE_NAME,if=floppy \
            -serial file:$QEMU_LOG \
            -nographic \
            -machine pc \
            -cpu pentium \
            -m 128M \
            -no-reboot \
            -display none
          
          echo "--- QEMU Log ---"
          cat $QEMU_LOG
          echo "----------------"

      - name: Analyze QEMU Results
        if: always()
        run: |
          if [ ! -f $QEMU_LOG ] || [ ! -s $QEMU_LOG ]; then
            echo "❌ No QEMU log detected"
            exit 1
          fi

          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $QEMU_LOG; then
            echo "✅ QEMU SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting" $QEMU_LOG; then
            echo "⚠️  QEMU PARTIAL: Kernel started but incomplete"
            tail -n 20 $QEMU_LOG
          else
            echo "❌ QEMU FAILURE: No initialization detected"
            cat $QEMU_LOG
            exit 1
          fi

      - name: Generate Bochs Configuration
        run: |
          cat > bochsrc.txt <<EOF
          megs: 128
          romimage: file=/usr/share/bochs/BIOS-bochs-latest
          vgaromimage: file=/usr/share/bochs/VGABIOS-lgpl-latest
          floppya: 1_44=$IMAGE_NAME, status=inserted
          boot: a
          log: bochs.log
          display_library: x
          panic: action=ask
          error: action=report
          info: action=report
          debug: action=ignore
          clock: sync=realtime
          EOF

      - name: Bochs Boot Test
        continue-on-error: true
        env:
          BOCHS_LOG: bochs.log
        run: |
          echo "Starting Bochs with logging..."
          timeout $BOCHS_TIMEOUT bochs -q -f bochsrc.txt > bochs_console.log 2>&1
          
          echo "--- Bochs Log Snippet ---"
          tail -n 20 $BOCHS_LOG
          echo "--- Console Output Snippet ---"
          tail -n 20 bochs_console.log

      - name: Analyze Bochs Results
        if: always()
        run: |
          if [ ! -f $BOCHS_LOG ] || [ ! -s $BOCHS_LOG ]; then
            echo "❌ No Bochs log detected"
            exit 1
          fi

          if grep -qi "Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $BOCHS_LOG; then
            echo "✅ Bochs SUCCESS: Kernel fully initialized!"
          elif grep -qi "Enhanced Holographic Kernel Starting" $BOCHS_LOG; then
            echo "⚠️  Bochs PARTIAL: Kernel started but incomplete"
            tail -n 20 $BOCHS_LOG
          else
            echo "❌ Bochs FAILURE: No initialization detected"
            cat $BOCHS_LOG
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            $IMAGE_NAME
            qemu.log
            bochs.log
            bochs_console.log
            Makefile
            boot.asm
            kernel_entry.asm
            holographic_kernel.c
            linker.ld
            *.o
            *.elf
            *.bin
          retention-days: 30

      - name: Post Cache Cleanup
        run: |
          sudo apt-get clean
          rm -rf /var/lib/apt/lists/*
