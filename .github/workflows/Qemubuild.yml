name: Boot Test with QEMU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Increased timeout
    env:
      QEMU_TIMEOUT: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v6 #Increment cache key
        restore-keys: |
          ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          echo "Checking cached dependencies..."
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Updating package list and installing dependencies..."
            sudo apt-get update -y
            sudo apt-get -f install -y # Fix unmet dependencies
            sudo apt-get install -y build-essential nasm qemu-system-i386 gcc-multilib g++-multilib
          else
            echo "✅ APT dependencies found in cache."
          fi

      - name: Verify Tools Installation
        run: |
          echo "Verifying tool availability:"
          which gcc && gcc --version | head -1
          which ld && ld --version | head -1
          which objcopy && objcopy --version | head -1
          which nasm && nasm -v
          which qemu-system-i386 && qemu-system-i386 --version | head -1

      - name: Build emergeos.img
        run: |
          echo "Building emergeos.img with native tools..."
          echo "Using compiler: $(which gcc)"

          if [ ! -f Makefile ]; then
            echo "Error: Makefile not found."
            ls -la
            exit 1
          fi

          make "clean" 2>&1 | tee clean.log || { echo "make clean failed, but continuing..."; cat clean.log; }
          make "emergeos.img" || { echo "Error: Make failed"; exit 1; }

          if [ ! -f emergeos.img ]; then
            echo "Error: emergeos.img not found."
            echo "emergeos.img NOT found so exiting"
            exit 1
          else
            echo "emergeos.img found!"
            # Find the absolute location of emergeos.img
            IMAGE_ACTUAL_PATH=$(realpath emergeos.img)
            echo "Actual path of emergeos.img: $IMAGE_ACTUAL_PATH"

            # Get the full path to the image
            IMAGE_PATH="${{ github.workspace }}/emergeos.img"

            echo "Starting QEMU with image: $IMAGE_PATH"
            timeout ${{ env.QEMU_TIMEOUT }}s qemu-system-i386 \
              -fda format=raw,file="$IMAGE_PATH" \
              -serial stdio \
              -nographic \
              -machine pc \
              -cpu pentium \
              -m 64M \
              -no-reboot > serial.log 2>&1 || true

            echo "--- Serial Output ---"
            cat serial.log
            echo "---------------------"

            if grep -qi "Kernel initialized successfully" serial.log; then
              echo "✅ Boot successful! Kernel initialized."
            else
              echo "❌ Kernel did not initialize properly."
              echo "Checking for any boot output..."
              if [ -s serial.log ]; then
                echo "Output contained: $(wc -l < serial.log) lines"
                head -20 serial.log
              else
                echo "Serial log is empty - QEMU may have failed to start"
              fi
              exit 1
            fi
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            emergeos.img
            serial.log
            boot.bin
            kernel.elf
            kernel.bin
            clean.log
          if-no-files-found: warn

      - name: Upload Serial Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-output
          path: serial.log
          if-no-files-found: warn
