name: Boot Test with QEMU (Fixed)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QEMU_TIMEOUT: 120
      IMAGE_NAME: emergeos.img
      SERIAL_LOG: serial.log

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v6
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          echo "Checking cached dependencies..."
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Updating package list and installing dependencies..."
            sudo apt-get update -y
            sudo apt-get -f install -y
            sudo apt-get install -y build-essential nasm qemu-system-i386 gcc-multilib g++-multilib
          else
            echo "✅ APT dependencies found in cache."
          fi

      - name: Verify Tools Installation
        run: |
          echo "Verifying tool availability:"
          which gcc && gcc --version | head -1
          which ld && ld --version | head -1
          which objcopy && objcopy --version | head -1
          which nasm && nasm -v
          which qemu-system-i386 && qemu-system-i386 --version | head -1

      - name: Build Kernel Image
        run: |
          echo "Building $IMAGE_NAME with native tools..."
          if [ ! -f Makefile ]; then
            echo "❌ Error: Makefile not found."
            ls -la
            exit 1
          fi
          
          make clean 2>/dev/null || echo "No clean target, continuing..."
          make $IMAGE_NAME || { echo "❌ Error: Make failed"; exit 1; }
          
          if [ ! -f $IMAGE_NAME ]; then
            echo "❌ Error: $IMAGE_NAME was not created."
            exit 1
          fi
          
          echo "✅ $IMAGE_NAME built successfully! Size: $(stat -c%s $IMAGE_NAME) bytes"

      - name: Run QEMU Boot Test
        run: |
          echo "Starting QEMU with image: $IMAGE_NAME"
          
          # ✅ FIXED: Use correct -fda syntax AND -serial file
          timeout $QEMU_TIMEOUT qemu-system-i386 \
            -fda $IMAGE_NAME \
            -serial file=$SERIAL_LOG \
            -nographic \
            -machine pc \
            -cpu pentium \
            -m 64M \
            -no-reboot \
            > /dev/null 2>&1 || echo "QEMU exited (expected)"
          
          echo "--- QEMU Serial Output ---"
          if [ -f $SERIAL_LOG ]; then
            cat $SERIAL_LOG
          else
            echo "❌ No serial log created!"
            exit 1
          fi
          echo "---------------------------"

      - name: Analyze Boot Results
        run: |
          if [ ! -f $SERIAL_LOG ] || [ ! -s $SERIAL_LOG ]; then
            echo "❌ No serial output detected. QEMU may have failed to start."
            exit 1
          fi
          
          if grep -qi "Kernel initialized successfully\|Kernel Fully Initialized\|=== Kernel Fully Initialized ===" $SERIAL_LOG; then
            echo "✅ SUCCESS: Kernel initialized successfully!"
          elif grep -qi "Enhanced Holographic Kernel Starting\|Holographic Kernel Starting" $SERIAL_LOG; then
            echo "⚠️  PARTIAL: Kernel started but may not have completed initialization"
            tail -20 $SERIAL_LOG
          elif grep -qi "Protected Mode Test: PASSED" $SERIAL_LOG; then
            echo "⚠️  PARTIAL: Protected mode OK but kernel initialization incomplete"
            tail -20 $SERIAL_LOG
          else
            echo "❌ FAILURE: No recognizable boot messages detected."
            echo "Full output:"
            cat $SERIAL_LOG
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-boot-artifacts
          path: |
            $IMAGE_NAME
            $SERIAL_LOG
            *.bin
            *.elf
            Makefile
            boot.asm
            kernel_entry.asm
            holographic_kernel.c
            linker.ld
          if-no-files-found: warn
