name: Boot Test with QEMU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QEMU_TIMEOUT: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile', '**/dependencies.txt', 'packages.txt') }}-v6
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Save Installed Packages
        run: dpkg --get-selections "*" > packages.txt

      - name: Install Dependencies
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -y
            sudo apt-get install -y build-essential nasm qemu-system-i386 gcc-multilib g++-multilib
          fi

      - name: Verify Tools Installation
        run: |
          which gcc && gcc --version
          which ld && ld --version
          which objcopy && objcopy --version
          which nasm && nasm -v
          which qemu-system-i386 && qemu-system-i386 --version

      - name: Build emergeos.img
        run: |
          if [ ! -f Makefile ]; then
            echo "Error: Makefile not found." && ls -la && exit 1
          fi

          make clean || echo "make clean failed, continuing..."
          make emergeos.img

          if [ ! -f emergeos.img ]; then
            echo "Error: emergeos.img was not created." && exit 1
          fi

          IMAGE_ACTUAL_PATH=$(realpath emergeos.img)
          echo "Actual path of emergeos.img: $IMAGE_ACTUAL_PATH"

          sleep 4

          timeout "${QEMU_TIMEOUT}"s qemu-system-i386 \
            -fda "$IMAGE_ACTUAL_PATH" \
            -serial stdio \
            -nographic \
            -machine pc \
            -cpu pentium \
            -m 64M \
            -no-reboot > serial.log 2>&1 || true

          echo "--- Serial Output ---"
          cat serial.log || true
          echo "---------------------"

          if grep -qi "Kernel Fully Initialized\|initialized successfully" serial.log; then
            echo "✅ Boot successful! Kernel initialized."
          else
            echo "❌ Kernel did not initialize properly."
            if [ -s serial.log ]; then
              head -20 serial.log
            else
              echo "Serial log is empty - QEMU may have failed to start"
            fi
            exit 1
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            emergeos.img
            serial.log
            boot.bin
            kernel.elf
            kernel.bin
            clean.log
          if-no-files-found: warn

      - name: Upload Serial Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-output
          path: serial.log
          if-no-files-found: warn
